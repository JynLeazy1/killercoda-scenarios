apiVersion: v1
kind: Namespace
metadata:
  name: infra
---
apiVersion: v1
kind: Namespace
metadata:
  name: cafe
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coffee-v1
  namespace: cafe
spec:
  replicas: 2
  selector:
    matchLabels: {app: coffee, version: v1}
  template:
    metadata:
      labels: {app: coffee, version: v1}
    spec:
      containers:
      - name: echo
        image: registry.k8s.io/gateway-api/echo-basic:v1.5.1
        ports: [{containerPort: 3000}]
        env:
        - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
        - {name: NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
        resources: {requests: {cpu: 10m, memory: 16Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coffee-v2
  namespace: cafe
spec:
  replicas: 1
  selector:
    matchLabels: {app: coffee, version: v2}
  template:
    metadata:
      labels: {app: coffee, version: v2}
    spec:
      containers:
      - name: echo
        image: registry.k8s.io/gateway-api/echo-basic:v1.5.1
        ports: [{containerPort: 3000}]
        env:
        - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
        - {name: NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
        resources: {requests: {cpu: 10m, memory: 16Mi}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tea
  namespace: cafe
spec:
  replicas: 1
  selector:
    matchLabels: {app: tea}
  template:
    metadata:
      labels: {app: tea}
    spec:
      containers:
      - name: echo
        image: registry.k8s.io/gateway-api/echo-basic:v1.5.1
        ports: [{containerPort: 3000}]
        env:
        - {name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
        - {name: NAMESPACE, valueFrom: {fieldRef: {fieldPath: metadata.namespace}}}
        resources: {requests: {cpu: 10m, memory: 16Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: coffee-v1
  namespace: cafe
spec:
  selector: {app: coffee, version: v1}
  ports: [{port: 80, targetPort: 3000}]
---
apiVersion: v1
kind: Service
metadata:
  name: coffee-v2
  namespace: cafe
spec:
  selector: {app: coffee, version: v2}
  ports: [{port: 80, targetPort: 3000}]
---
apiVersion: v1
kind: Service
metadata:
  name: tea
  namespace: cafe
spec:
  selector: {app: tea}
  ports: [{port: 80, targetPort: 3000}]
